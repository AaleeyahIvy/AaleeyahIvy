# Feeds the "sand signals" section: a sandworm that eats the contribution graph.
# Runs every 12 hours, on every push to main, and on demand from the Actions tab.
name: sandworm

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  stir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: summon the worm
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/sandworm-dark.svg?color_snake=#e0913f&color_dots=#15110e,#3b2615,#6e421f,#a5602a,#e0913f
            dist/sandworm-light.svg?color_snake=#8a4416&color_dots=#efe6d8,#e2c49a,#cf9f66,#b8763a,#8a4416

      - name: leave it on the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "the worm moves"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
